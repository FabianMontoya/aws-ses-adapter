name: PR Title Check

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened

jobs:
  pr-title-lint:
    # Skip this check for dependabot and other automated PRs
    if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Validate PR Title
        id: check
        uses: thehanimo/pr-title-checker@v1.4.3
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          pass_on_octokit_error: false
          configuration_path: .github/workflows/pr-title-checker-config.json

      # ❌ If invalid → comment with instructions
      - name: Comment when PR title is invalid
        if: steps.check.outputs.success == 'false'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: "PR Title Check"
          recreate: true
          message: |
            ### 🚨 PR Title Needs Formatting

            Your PR title must follow the **Conventional Commits** format:

            `<type>[optional scope][!]: <description>`

            **Allowed types:** `feat` `fix` `docs` `style` `refactor` `perf` `test` `build` `ci` `chore` `revert`

            **Optional scope:** a noun in parentheses describing the area changed, e.g. `(client)`

            **Optional `!`:** append before the colon to indicate a breaking change

            ✅ Examples:
            - `feat(client): add retry support`
            - `fix: handle missing region configuration`
            - `chore(deps): update @aws-sdk/client-ses`
            - `refactor!: rename SendEmailOptions to SesEmailOptions`

            ---

            Maximum 100 characters total.

      # ✅ If valid → comment success
      - name: Comment when PR title is valid
        if: steps.check.outputs.success == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: "PR Title Check"
          recreate: true
          message: |
            ### ✅ PR Title Formatted Correctly

            The PR title follows the required convention.
            Thank you for keeping the repository consistent.

      # 🔥 Finally fail the job if invalid (for branch protection)
      - name: Fail workflow if invalid
        if: steps.check.outputs.success == 'false'
        run: exit 1
